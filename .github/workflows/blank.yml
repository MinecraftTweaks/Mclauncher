      - name: Android Projesini Hazırla
        run: |
          mkdir -p app/src/main/java/io/miuix/bedrocklauncher
          mkdir -p app/src/main/res/values

          # 1. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
